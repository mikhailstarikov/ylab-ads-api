[project]
name = "ylab-ads-api"
version = "0.1.0"
description = "REST API для сервиса объявлений Ylab"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "faker>=30.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"